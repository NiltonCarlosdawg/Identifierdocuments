name: CI

on:
  push:
    branches: [main, master, "fix/**", "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (typecheck + unit tests)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docid_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: docid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docid_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://docid_test:test-only-password@localhost:5432/docid_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-only-secret
      BULLMQ_ENABLED: "false"
      CLASSIFIER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Migrations
        run: bun src/db/migrate.ts
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Unit tests
        run: bun test src/__tests__/classifier-cache.test.ts src/__tests__/notification.service.test.ts src/__tests__/document-tags.test.ts src/__tests__/document-tags-route.test.ts src/__tests__/access-decision.test.ts src/__tests__/attachment-admin.test.ts src/__tests__/migrate-fresh.test.ts src/__tests__/auth-lookup.integration.test.ts src/__tests__/rls-coverage.integration.test.ts src/__tests__/rls-app-role.integration.test.ts src/__tests__/session-hardening.test.ts src/__tests__/cors-origins.test.ts src/__tests__/identifier-prefix.test.ts src/__tests__/identifier-match.test.ts src/__tests__/identifier-date.test.ts src/__tests__/email-notifications.test.ts src/__tests__/license-enforcement.test.ts src/__tests__/license.integration.test.ts src/__tests__/license.test.ts src/__tests__/license.service.test.ts src/__tests__/license-flow.test.ts

  desktop:
    name: Desktop (typecheck + unit tests)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Typecheck + build frontend
        run: bun run build
      - name: Unit tests
        run: bun test

  rust-sync:
    name: Desktop Rust (sync unit tests)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev
      - name: Cargo test (lib)
        run: cargo test --lib -- --test-threads=2

  rust-windows:
    name: Desktop Rust (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo test (lib)
        run: cargo test --lib -- --test-threads=2

  e2e:
    name: E2E (Playwright UI smoke)
    runs-on: ubuntu-22.04
    needs: [desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build desktop frontend
        working-directory: apps/desktop
        run: bun run build
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run E2E
        run: bun run test:e2e
